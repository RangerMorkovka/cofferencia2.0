meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"

build:
  # 1. Указываем Amvera зайти внутрь папки api перед сборкой
  dir: api
  skip: false
  # 2. Правильно собираем артефакты из подпапки api
  artifacts:
    "api/**/*": /

run:
  command: node index.js
  persistenceMount: /data
  containerPort: "80"
